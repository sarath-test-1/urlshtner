# ══════════════════════════════════════════════════════════════════════════════
# reusable-test.yml — Reusable Workflow: Run Tests (url-shortener)
# ══════════════════════════════════════════════════════════════════════════════
#
# Adapted from the reference CI project. Key differences for this app:
#   - MongoDB: this app uses transactions, which require a replica set —
#     even a single-node one. GitHub Actions' `services:` block can't run
#     a post-start command (no way to `rs.initiate()` after the container
#     comes up), so Mongo is started manually as a step instead: `docker run`
#     with `--replSet rs0`, then a follow-up step calls `rs.initiate()` and
#     polls until it's PRIMARY. No auth (matches your local test setup).
#   - Redis: this app DOES need a real Redis instance for integration tests,
#     AND it requires auth (REDIS_PASSWORD/REDIS_USERNAME in your .env).
#     `services:` can't pass a `--requirepass` argument (no command override
#     support), and bitnami/redis's versioned tags (e.g. 7.2) no longer
#     exist since Bitnami's move to sha256-only "Secure Images" tagging —
#     so Redis is started the same way as Mongo: a manual `docker run` step
#     with `redis:7-alpine`, passing --requirepass directly as a CLI arg.
#   - The Redis password below is a throwaway value that only exists inside
#     this ephemeral CI container — not a real secret — so it's inlined
#     rather than stored as a GitHub secret. Happy to switch it to a repo
#     secret if you'd rather.
#   - No lint step yet — ESLint isn't set up in this project. Slot a
#     "Run ESLint" step in before unit tests once you add one.
#
# HOW TO CALL THIS:
#   jobs:
#     run-tests:
#       uses: ./.github/workflows/reusable-test.yml
#       with:
#         node-version: "20"

name: Reusable - Run Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to test against"
        required: true
        type: string
    outputs:
      coverage-pct:
        description: "Line coverage percentage"
        value: ${{ jobs.test.outputs.coverage-pct }}

jobs:
  test:
    name: Test (Node ${{ inputs.node-version }})
    runs-on: ubuntu-latest

    outputs:
      coverage-pct: ${{ steps.coverage.outputs.pct }}

    # No `services:` block — both Mongo and Redis are started manually as
    # steps below, since neither can be configured the way this app needs
    # via GitHub Actions' service-container syntax (see header comment).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # ── Start Redis (with auth) ───────────────────────────────────────────
      # Matches your .env's REDIS_PASSWORD/REDIS_USERNAME setup.
      - name: Start Redis
        run: |
          docker run -d \
            --name redis-test \
            -p 6379:6379 \
            redis:7-alpine redis-server --requirepass ci_test_redis_password

          echo "Waiting for Redis to accept connections..."
          for i in $(seq 1 15); do
            if docker exec redis-test redis-cli -a ci_test_redis_password ping > /dev/null 2>&1; then
              echo "Redis is up."
              break
            fi
            sleep 2
          done

      # ── Start MongoDB as a single-node replica set ────────────────────────
      # Transactions require a replica set even with one node. `docker run`
      # (not `services:`) so we can exec into it afterward to initiate.
      - name: Start MongoDB (replica set)
        run: |
          docker run -d \
            --name mongo-test \
            -p 27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all

          echo "Waiting for MongoDB to accept connections..."
          for i in $(seq 1 15); do
            if docker exec mongo-test mongosh --quiet --eval "db.runCommand({ ping: 1 })" > /dev/null 2>&1; then
              echo "MongoDB is up."
              break
            fi
            sleep 2
          done

      - name: Initiate replica set
        run: |
          # Explicit host here matters: without it, Mongo registers itself
          # in the replica set config using its own Docker-assigned
          # container hostname (e.g. "f7f623e1477f"), which the driver
          # then tries to use for the real connection after the initial
          # handshake — and that hostname doesn't resolve from the runner.
          # Pin it to 127.0.0.1:27017 to match what's actually reachable
          # (same host used in MONGODB_URI below).
          docker exec mongo-test mongosh --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"

          echo "Waiting for replica set to elect a PRIMARY..."
          for i in $(seq 1 15); do
            STATE=$(docker exec mongo-test mongosh --quiet --eval "rs.status().myState" 2>/dev/null || echo "0")
            if [ "$STATE" = "1" ]; then
              echo "Replica set is PRIMARY."
              break
            fi
            sleep 2
          done

      # NOTE: no lint step yet — see header comment.

      # ── Unit tests ─────────────────────────────────────────────────────────
      # NOTE: despite the name, these still need Mongo/Redis env vars —
      # jest.setup.js's beforeAll/afterAll (DB connect/disconnect) are
      # global hooks that run for every test file Jest picks up, not just
      # integration tests. The "fully mocked, no service dependency"
      # assumption in an earlier version of this comment was wrong.
      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          MONGODB_URI: "mongodb://127.0.0.1:27017/url_shortener_test?replicaSet=rs0"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_USERNAME: default
          REDIS_PASSWORD: ci_test_redis_password
          REDIS_PROVIDER: local
          BASE_URL: http://localhost:3000
          # Throwaway values only used to sign test tokens in CI — not
          # real secrets protecting anything, so inlined like the rest
          # of this file rather than requiring two more repo secrets.
          JWT_SECRET: ci_test_jwt_secret
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret
          JWT_EXPIRE: 7d
          RATE_LIMIT_WINDOW_MS: 60000
          RATE_LIMIT_MAX_REQUESTS: 10000

      # ── Integration tests ─────────────────────────────────────────────────
      # Mongo: real single-node replica set started above, no auth.
      # Redis: hits the real service container, using the same env var
      # names as your .env (REDIS_HOST/REDIS_PORT/REDIS_USERNAME/REDIS_PASSWORD).
      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          MONGODB_URI: "mongodb://127.0.0.1:27017/url_shortener_test?replicaSet=rs0"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_USERNAME: default
          REDIS_PASSWORD: ci_test_redis_password
          REDIS_PROVIDER: local
          BASE_URL: http://localhost:3000
          # Throwaway values only used to sign test tokens in CI — not
          # real secrets protecting anything, so inlined like the rest
          # of this file rather than requiring two more repo secrets.
          JWT_SECRET: ci_test_jwt_secret
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret
          JWT_EXPIRE: 7d
          RATE_LIMIT_WINDOW_MS: 60000
          RATE_LIMIT_MAX_REQUESTS: 10000

      # ── Extract coverage percentage ───────────────────────────────────────
      - name: Extract coverage percentage
        id: coverage
        run: |
          PCT=$(npm run test:coverage -- --coverageReporters=text 2>/dev/null | grep "Lines" | awk '{print $3}' | tr -d '%' || echo "0")
          echo "pct=${PCT}" >> $GITHUB_OUTPUT
          echo "Coverage: ${PCT}%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-node-${{ inputs.node-version }}
          path: coverage/
          retention-days: 7

      - name: Stop test containers
        if: always()
        run: |
          docker rm -f mongo-test || true
          docker rm -f redis-test || true