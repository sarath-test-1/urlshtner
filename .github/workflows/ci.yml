# ══════════════════════════════════════════════════════════════════════════════
# ci.yml — Main CI Pipeline (url-shortener)
# ══════════════════════════════════════════════════════════════════════════════
#
# PHASE 3: adds coverage-gate + secrets-scan (Gitleaks) + Trivy image scan.
# Coming in later phases: Docker Hub push (with approval gate), Dependabot
# config, CodeQL.
# deploy.yml is untouched — this workflow is CI-only, kept as a portfolio
# reference alongside the simple Render deploy pipeline.
#
# PIPELINE OVERVIEW:
#
#   [push / PR to main]
#       │
#       ├──────────────┬──────────────────────┐
#       ▼               ▼                      ▼
#   ┌─────────┐   ┌──────────────┐   ┌─────────────────────────────────────┐
#   │  audit  │   │ secrets-scan │   │  test (matrix: Node 18/20/22)        │
#   └─────────┘   └──────────────┘   │  install → unit → integration        │  ← calls reusable-test.yml
#                                    └──────────────────┬────────────────────┘
#                                                        ▼
#                                              ┌──────────────────┐
#                                              │  coverage-gate   │
#                                              └────────┬─────────┘
#                                                        │
#              (all of audit, secrets-scan, coverage-gate must pass)
#                                                        ▼
#                                          ┌───────────────────────────┐
#                                          │  docker-build              │
#                                          │  build → trivy scan → smoke│
#                                          └─────────────────────────────┘

name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

  workflow_dispatch:
    inputs:
      skip-docker:
        description: "Skip Docker build?"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_ENV: test

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Security Audit
  # ════════════════════════════════════════════════════════════════════════════
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        # --omit=dev: most of this app's vulnerabilities came from
        # devDependencies (redoc-cli's Swagger toolchain, jest, webpack)
        # that never ship in the Docker image or to Render. Scoping to
        # production deps keeps this gate meaningful instead of blocking
        # on tooling that isn't actually deployed.
        run: npm audit --omit=dev --audit-level=high

  # ════════════════════════════════════════════════════════════════════════════
  # JOB: Secrets Scan (Gitleaks)
  # ════════════════════════════════════════════════════════════════════════════
  # Scans the working tree for committed secrets (API keys, passwords, etc.).
  # --no-git: scans files as they are on disk for this checkout, not the
  # full commit history — matches the reference Jenkins stage's approach.
  # Runs in parallel with audit/test — independent, fast check.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gitleaks secrets scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect --source=. --no-git -v

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Test Matrix
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Test
    needs: []             # Runs in parallel with audit
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]

    uses: ./.github/workflows/reusable-test.yml
    with:
      node-version: ${{ matrix.node-version }}
    # No `secrets:` block — this app's Redis service container needs no
    # password, and Mongo is handled in-process via mongodb-memory-server.
    # (Reference project passed db-password here for its real Postgres.)

  # ════════════════════════════════════════════════════════════════════════════
  # JOB: Coverage Gate
  # ════════════════════════════════════════════════════════════════════════════
  # After all matrix test jobs pass, this is a placeholder gate — actual
  # coverage thresholds are enforced by Jest's coverageThreshold config
  # (the test job would already have failed there if unmet). This job just
  # confirms the matrix is green and gives a single check to require on PRs.
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Check coverage threshold
        run: |
          echo "✅ All test jobs passed — coverage thresholds enforced by Jest config"
          echo "Coverage reports available as job artifacts in the Actions UI"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: Docker Build
  # ════════════════════════════════════════════════════════════════════════════
  # Build the image and smoke-test it against /health.
  #
  # ⚠️ IMPORTANT DEVIATION FROM THE REFERENCE WORKFLOW:
  # server.js `await`s a successful MongoDB connection before calling
  # app.listen() — if Mongo isn't reachable the process exits. The reference
  # workflow's smoke test pointed at DB_HOST=localhost with no real service
  # container behind it, which only worked because that app's health check
  # didn't depend on the DB. That trick would NOT work here — the container
  # would exit before /health ever responds.
  #
  # Fix: real Mongo service container + a manually-started Redis container
  # below (bitnami/redis's versioned tags no longer exist — see
  # reusable-test.yml's header comment for details), and the smoke-tested
  # container is run with `--network host` so "localhost" inside it actually
  # resolves to the runner (and therefore to these services). `-p` port
  # mapping is dropped since host networking exposes the port directly.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [audit, test, secrets-scan, coverage-gate]

    outputs:
      app-version: ${{ steps.version.outputs.app-version }}

    if: |
      github.event.pull_request.draft == false &&
      github.event.inputs.skip-docker != 'true'

    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: ci_test_mongo_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' -u admin -p ci_test_mongo_password --authenticationDatabase admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=${VERSION}" >> $GITHUB_OUTPUT
          echo "App version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false          # CI only — deploy.yml/Render handles actual deployment
          load: true
          tags: |
            url-shortener:${{ steps.version.outputs.app-version }}
            url-shortener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy vulnerability scan ──────────────────────────────────────────
      # Scans the built image itself — OS packages and base-image CVEs that
      # npm audit can't see (it only looks at the JS dependency tree).
      # Fails the build on HIGH/CRITICAL findings, same threshold as the
      # reference Jenkins stage. Runs before the smoke test so we don't
      # bother spinning up containers if the image itself is unsafe.
      - name: Trivy vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy image --timeout 10m --severity HIGH,CRITICAL --exit-code 1 \
            url-shortener:${{ github.sha }}

      # ── Start Redis (with auth) ───────────────────────────────────────────
      # Manual docker run, not `services:` — see reusable-test.yml's header
      # comment for why (no --requirepass support via services, and
      # bitnami/redis no longer has usable versioned tags).
      - name: Start Redis
        run: |
          docker run -d \
            --name redis-test \
            -p 6379:6379 \
            redis:7-alpine redis-server --requirepass ci_test_redis_password

          echo "Waiting for Redis to accept connections..."
          for i in $(seq 1 15); do
            if docker exec redis-test redis-cli -a ci_test_redis_password ping > /dev/null 2>&1; then
              echo "Redis is up."
              break
            fi
            sleep 2
          done

      # ── Smoke test the Docker image ───────────────────────────────────────
      # --network host: lets the container reach the Mongo/Redis service
      # containers via localhost (see the deviation note above).
      # NOTE: the app validates a set of required env vars at startup and
      # exits before app.listen() if any are missing — these are all
      # throwaway CI values, not real secrets.
      - name: Smoke test Docker image
        run: |
          docker run -d \
            --name ci-test \
            --network host \
            -e NODE_ENV=test \
            -e PORT=5000 \
            -e BASE_URL=http://localhost:5000 \
            -e MONGODB_URI="mongodb://admin:ci_test_mongo_password@localhost:27017/urlshortener?authSource=admin" \
            -e ADMIN_EMAIL=admin@example.com \
            -e ADMIN_PASSWORD=ci_test_admin_password \
            -e JWT_SECRET=ci_test_jwt_secret \
            -e JWT_REFRESH_SECRET=ci_test_jwt_refresh_secret \
            -e JWT_EXPIRE=1h \
            -e RATE_LIMIT_WINDOW_MS=900000 \
            -e RATE_LIMIT_MAX_REQUESTS=100 \
            -e SHORT_URL_LENGTH=6 \
            -e SERVER_NAME=url-shortener-ci \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e REDIS_USERNAME=default \
            -e REDIS_PASSWORD=ci_test_redis_password \
            -e REDIS_PROVIDER=local \
            url-shortener:${{ github.sha }}

          # Wait for the container to start (Mongo connect + listen)
          sleep 5

          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/health || \
            (docker logs ci-test && exit 1)

          echo "✅ Docker smoke test passed"

      - name: Stop test containers
        if: always()
        run: |
          docker rm -f ci-test || true
          docker rm -f redis-test || true

      - name: Write job summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| App Version | ${{ steps.version.outputs.app-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Build succeeded |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════════════════
  # JOB: Docker Hub Push
  # ════════════════════════════════════════════════════════════════════════════
  # Only runs on an actual push to main (never on PRs — we don't want every
  # PR publishing an image). Gated behind the `docker-hub-publish`
  # GitHub Environment: this workflow YAML alone doesn't create the approval
  # requirement — that's a repo setting. See setup note below.
  #
  # ⚠️ ONE-TIME SETUP REQUIRED (not part of this file):
  #   1. Repo → Settings → Environments → New environment →
  #      name it exactly "docker-hub-publish"
  #   2. Under "Deployment protection rules", add yourself (or a team) as a
  #      required reviewer. This is what makes the job pause and wait for
  #      manual approval before running.
  #   3. Repo → Settings → Secrets and variables → Actions → New repository
  #      secret, twice: DOCKERHUB_USERNAME (your Docker Hub username) and
  #      DOCKERHUB_TOKEN (a Docker Hub access token, not your password —
  #      generate one at hub.docker.com → Account Settings → Security).
  docker-push:
    name: Docker Hub Push
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: docker-hub-publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Rebuilds from the same GHA layer cache docker-build already
      # populated, so this is fast — not a from-scratch build. Actually
      # pushes this time (push: true), unlike docker-build's local-only run.
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/urlshtner1:${{ needs.docker-build.outputs.app-version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/urlshtner1:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/urlshtner1:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        run: |
          echo "## 🚀 Docker Hub Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Repo | \`${{ secrets.DOCKERHUB_USERNAME }}/urlshtner1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | ${{ needs.docker-build.outputs.app-version }}, ${{ github.sha }}, latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Pushed |" >> $GITHUB_STEP_SUMMARY
